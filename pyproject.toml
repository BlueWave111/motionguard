[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionguard"
version = "0.1.0"
description = "YOLO pose, per-person tracking and causal temporal multilabel event detection"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "joblib>=1.3,<2", "scipy>=1.11,<2"]

[project.optional-dependencies]
video = ["ultralytics>=8.3,<9", "opencv-python>=4.9,<5", "lap>=0.5.12,<0.6"]
tcn = ["torch>=2.2,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
motionguard = "motionguard.cli:main"

[tool.setuptools.packages.find]
include = ["motionguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
